<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680">
<defs>
<style>text{font-family:'Inter','Segoe UI',Arial,sans-serif}.mono{font-family:'JetBrains Mono','Fira Code','Courier New',monospace}</style>
<linearGradient id="gbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
<linearGradient id="gblue" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1f6feb"/><stop offset="100%" stop-color="#0d419d"/></linearGradient>
<linearGradient id="ggreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2ea043"/><stop offset="100%" stop-color="#196c2e"/></linearGradient>
<linearGradient id="gpurple" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8957e5"/><stop offset="100%" stop-color="#553098"/></linearGradient>
<linearGradient id="gorange" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9e6a03"/><stop offset="100%" stop-color="#5a3e00"/></linearGradient>
<linearGradient id="gred" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b91c1c"/><stop offset="100%" stop-color="#7f1d1d"/></linearGradient>
<linearGradient id="gcyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0e7490"/><stop offset="100%" stop-color="#164e63"/></linearGradient>
<linearGradient id="gteal" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#134e4a"/></linearGradient>
<linearGradient id="gdark" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#161b22"/><stop offset="100%" stop-color="#0d1117"/></linearGradient>
<marker id="ablue"   markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#58a6ff"/></marker>
<marker id="agreen"  markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
<marker id="aorange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#e3b341"/></marker>
<marker id="ared"    markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f85149"/></marker>
<marker id="apurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#a371f7"/></marker>
<marker id="acyan"   markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#76e3ea"/></marker>
<marker id="adim"    markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#8b949e"/></marker>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.6"/></filter>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1080" height="680" fill="url(#gbg)"/>
<rect x="0" y="0" width="1080" height="78" rx="0" fill="#161b22" stroke="#30363d" stroke-width="0" opacity="1"/>
<line x1="0" y1="78" x2="1080" y2="78" stroke="#30363d" stroke-width="1"/>
<text x="540" y="35" font-size="20" fill="#e6edf3" text-anchor="middle" font-weight="700">Two-Tower Hybrid Inference Stack</text>
<text x="540" y="60" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="normal">V1 frequency prior  +  V2 amplitude tower  →  Hungarian-matched hybrid output</text>
<rect x="390" y="95" width="300" height="52" rx="8" fill="url(#gdark)" stroke="#30363d" stroke-width="1.5" opacity="1"/>
<text x="540" y="117" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="700">Input: Molecular Graph</text>
<text x="540" y="136" font-size="10" fill="#8b949e" text-anchor="middle" class="mono">x:(N,5)  edge_index:(2,E)  edge_attr:(E,4)</text>
<line x1="490" y1="147" x2="310" y2="175" stroke="#e3b341" stroke-width="2" marker-end="url(#aorange)"/>
<line x1="590" y1="147" x2="770" y2="175" stroke="#58a6ff" stroke-width="2" marker-end="url(#ablue)"/>
<rect x="30" y="178" width="390" height="350" rx="12" fill="url(#gorange)" stroke="#e3b341" stroke-width="2" opacity="0.18"/>
<rect x="30" y="178" width="390" height="350" rx="12" fill="none" stroke="#e3b341" stroke-width="2" opacity="1"/>
<rect x="40" y="186" width="370" height="30" rx="6" fill="#e3b341" stroke="none" stroke-width="1.5" opacity="1"/>
<text x="225" y="206" font-size="13" fill="#0d1117" text-anchor="middle" font-weight="700">V1  —  Frequency Tower</text>
<rect x="44" y="226" width="362" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" opacity="1"/>
<text x="225" y="244" font-size="11" fill="#e6edf3" text-anchor="middle" font-weight="600">SpectralEquivariantGNNV1</text>
<text x="225" y="260" font-size="9" fill="#484f58" text-anchor="middle" class="mono">mace_net_v1.py</text>
<rect x="44" y="281" width="362" height="44" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" opacity="1"/>
<text x="225" y="299" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="600">Backbone: Linear GNN
+ global_add_pool</text>
<rect x="44" y="336" width="362" height="44" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" opacity="1"/>
<text x="225" y="354" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="600">K_max = 50  fixed output slots</text>
<text x="225" y="370" font-size="9" fill="#484f58" text-anchor="middle" class="mono">Simple scalar heads</text>
<rect x="44" y="391" width="362" height="44" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" opacity="1"/>
<text x="225" y="409" font-size="11" fill="#3fb950" text-anchor="middle" font-weight="600">head_freq: (B,50) → ω_k  [Softplus]</text>
<rect x="44" y="446" width="362" height="44" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" opacity="1"/>
<text x="225" y="464" font-size="11" fill="#58a6ff" text-anchor="middle" font-weight="600">head_prob: (B,50) → p_k  [Sigmoid]</text>
<rect x="660" y="178" width="390" height="350" rx="12" fill="url(#gblue)" stroke="#58a6ff" stroke-width="2" opacity="0.18"/>
<rect x="660" y="178" width="390" height="350" rx="12" fill="none" stroke="#58a6ff" stroke-width="2" opacity="1"/>
<rect x="670" y="186" width="370" height="30" rx="6" fill="#58a6ff" stroke="none" stroke-width="1.5" opacity="1"/>
<text x="855" y="206" font-size="13" fill="#0d1117" text-anchor="middle" font-weight="700">V2  —  Amplitude Tower</text>
<rect x="674" y="226" width="362" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" opacity="1"/>
<text x="855" y="244" font-size="11" fill="#e6edf3" text-anchor="middle" font-weight="600">SpectralEquivariantGNN</text>
<text x="855" y="260" font-size="9" fill="#484f58" text-anchor="middle" class="mono">mace_net.py  (GATv2)</text>
<rect x="674" y="281" width="362" height="44" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" opacity="1"/>
<text x="855" y="299" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="600">GATv2Conv × 4  +  Set Decoder</text>
<text x="855" y="315" font-size="9" fill="#484f58" text-anchor="middle" class="mono">Transformer: 2L, 4H</text>
<rect x="674" y="336" width="362" height="44" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" opacity="1"/>
<text x="855" y="354" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="600">K_max = 64  learnable query slots</text>
<text x="855" y="370" font-size="9" fill="#484f58" text-anchor="middle" class="mono">Cardinality-aware</text>
<rect x="674" y="391" width="362" height="44" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" opacity="1"/>
<text x="855" y="409" font-size="11" fill="#e3b341" text-anchor="middle" font-weight="600">head_amp: (B,64) → B_k  [Softplus × scale]</text>
<rect x="674" y="446" width="362" height="44" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" opacity="1"/>
<text x="855" y="464" font-size="11" fill="#f85149" text-anchor="middle" font-weight="600">head_count: (B,) → N̂  [Softplus]</text>
<text x="855" y="480" font-size="9" fill="#484f58" text-anchor="middle" class="mono">count head</text>
<rect x="120" y="558" width="840" height="78" rx="12" fill="url(#gteal)" stroke="#76e3ea" stroke-width="2" opacity="1"/>
<text x="540" y="580" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="700">Hybrid Combiner  (utils/hybrid_inference.py)</text>
<text x="135" y="604" font-size="9" fill="#e6edf3" text-anchor="start" font-weight="normal">① N̂ from V2 count head</text>
<text x="298" y="604" font-size="9" fill="#e6edf3" text-anchor="start" font-weight="normal">② Top-N freq slots from V1 (by prob)</text>
<text x="461" y="604" font-size="9" fill="#e6edf3" text-anchor="start" font-weight="normal">③ Overflow freq from V2 if N̂ &gt; K_max_v1</text>
<text x="624" y="604" font-size="9" fill="#e6edf3" text-anchor="start" font-weight="normal">④ Hungarian: match V2 amps to selected freqs</text>
<text x="787" y="604" font-size="9" fill="#e6edf3" text-anchor="start" font-weight="normal">⑤ Output: {ω_k, B_k, p_k}</text>
<text x="540" y="623" font-size="10" fill="#76e3ea" text-anchor="middle" font-weight="normal">Final hybrid peak set — best of V1 frequencies + V2 amplitudes</text>
<line x1="225" y1="528" x2="225" y2="556" stroke="#e3b341" stroke-width="2.5" marker-end="url(#aorange)"/>
<line x1="855" y1="528" x2="855" y2="556" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#ablue)"/>
<line x1="540" y1="636" x2="540" y2="650" stroke="#3fb950" stroke-width="2.5" marker-end="url(#agreen)"/>
<rect x="390" y="652" width="300" height="22" rx="6" fill="#196c2e" stroke="#3fb950" stroke-width="1" opacity="1"/>
<text x="540" y="667" font-size="10" fill="#e6edf3" text-anchor="middle" font-weight="normal">Reconstructed Absorption Spectrum: S(ω) = Σ B_k · γ / ((ω−ω_k)² + γ²)</text>
<circle cx="30" cy="660" r="6" fill="#e3b341" stroke="none" stroke-width="0" opacity="1"/>
<text x="44" y="665" font-size="9" fill="#8b949e" text-anchor="start" font-weight="normal">Frequency tower  (V1)</text>
<circle cx="200" cy="660" r="6" fill="#58a6ff" stroke="none" stroke-width="0" opacity="1"/>
<text x="214" y="665" font-size="9" fill="#8b949e" text-anchor="start" font-weight="normal">Amplitude tower  (V2)</text>
<circle cx="380" cy="660" r="6" fill="#76e3ea" stroke="none" stroke-width="0" opacity="1"/>
<text x="394" y="665" font-size="9" fill="#8b949e" text-anchor="start" font-weight="normal">Hybrid combiner</text>
</svg>
